# CPU smoke-test on SYNTHETIC data. Output is NOT a real model.
seed: 0
device: cpu
run_name: debug_cpu
synthetic: true
paths: {datasets: configs/datasets.yaml, manifest: data/manifest.csv, runs: runs}
data: {img_size: 64, batch_size: 4, num_workers: 0, datasets: [], clahe: false, imbalance: none}
model: {backbone: convnext_tiny, pretrained: false, decoder_dim: 32, dropout: 0.1, lesion_attention: true}
loss: {grade: coral, weighting: fixed, lambda_grade: 1.0, lambda_seg: 1.0, lambda_quality: 0.2, focal_gamma: 2.0, seg_pos_weight: [4.0, 2.0, 2.0, 2.0]}
train: {epochs: 2, lr: 0.001, weight_decay: 0.0001, warmup_epochs: 1, grad_clip: 1.0, amp: false, patience: 5, freeze_backbone_epochs: 0}
uncertainty: {mc_samples: 3, abstain_entropy: 1.0}
quality: {min_blur_var: 30.0, brightness_range: [40.0, 220.0], min_fundus_fraction: 0.35}
