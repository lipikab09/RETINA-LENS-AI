services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./runs/convnext_coral_mt:/models:ro"]   # mount your trained checkpoint dir (best.pt); never baked into the image
    environment: [RETINA_CHECKPOINT=/models/best.pt, RETINA_DEVICE=cpu]
  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes: ["./runs/convnext_coral_mt:/models:ro", "./results:/app/results:ro"]
    environment: [RETINA_CHECKPOINT=/models/best.pt, RETINA_DEVICE=cpu]
