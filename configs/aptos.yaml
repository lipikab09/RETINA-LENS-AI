seed: 42
device: auto            # auto | cpu | cuda
run_name: aptos_ce_baseline
paths:
  datasets: configs/datasets.yaml   # copy datasets.example.yaml -> datasets.yaml
  manifest: data/manifest.csv
  runs: runs
data:
  img_size: 512
  batch_size: 2
  num_workers: 2
  datasets: [aptos]
  clahe: true
  imbalance: weighted_loss          # none | weighted_loss | sampler
model:
  backbone: convnext_tiny           # convnext_tiny | tf_efficientnetv2_s | swin_tiny_patch4_window7_224
  pretrained: true
  decoder_dim: 128
  dropout: 0.2
  lesion_attention: false            # cross-task attention (Exp. 5 ablation)
loss:
  grade: ce                      # ce | wce | focal | coral | cumulative
  weighting: fixed                  # fixed | uncertainty
  lambda_grade: 1.0
  lambda_seg: 1.0
  lambda_quality: 0.2
  focal_gamma: 2.0
  seg_pos_weight: [4.0, 2.0, 2.0, 2.0]   # MA, HE, EX, SE
train:
  epochs: 40
  lr: 0.0002
  weight_decay: 0.0001
  warmup_epochs: 2
  grad_clip: 1.0
  amp: true
  patience: 8
  freeze_backbone_epochs: 0
uncertainty:
  mc_samples: 10
  abstain_entropy: 1.0              # tune on VALIDATION set only
quality:
  min_blur_var: 30.0
  brightness_range: [40.0, 220.0]
  min_fundus_fraction: 0.35
